<!doctype html><html><body style="margin:0">
<iframe id="esc" src="../v1/" allow="serial; usb" style="width:100%;height:95vh;border:0"></iframe>
<script>
window.recus=[];
window.addEventListener('message',(m)=>{ if(m.origin===location.origin && m.data && m.data.source==='trueglide-esc') window.recus.push(m.data.event); });
window.demanderDeconnexion=()=>document.getElementById('esc').contentWindow.postMessage({source:'trueglide-configurator',command:'disconnect'},location.origin);
</script></body></html>
